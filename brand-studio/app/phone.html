<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Presto Brand Studio · Mobile prototype</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 24px;
        padding: 32px 16px; background: radial-gradient(circle at 30% 20%, #16265C, #030A26 60%);
        font: 400 15px/1.5 'PT Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #CBD5E1;
      }
      .wrap { display: grid; grid-template-columns: auto minmax(0, 340px); gap: 48px; align-items: center; }
      .phone {
        width: 390px; height: 844px; padding: 14px; border-radius: 56px; background: #0B0F19;
        box-shadow: 0 0 0 2px #1E293B, 0 40px 80px rgb(0 0 0 / 0.5); position: relative;
      }
      .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 42px; background: #fff; display: block; }
      .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 126px; height: 30px; border-radius: 0 0 18px 18px; background: #0B0F19; z-index: 1; }
      h1 { margin: 0 0 10px; color: #fff; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; }
      p { margin: 0 0 14px; }
      a { color: #fff; font-weight: 700; }
      .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
      .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; background: #fff; color: #030A26; text-decoration: none; }
      .btn--ghost { background: transparent; color: #fff; border: 1px solid #475569; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #A78BFA; }
      /* On an actual phone, just open the prototype full-screen. */
      @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } .phone { transform: scale(0.9); transform-origin: top center; } }
      @media (max-width: 480px) { body { padding: 0; } .phone, aside { display: none; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="phone"><span class="notch"></span><iframe src="./" title="Presto Brand Studio mobile prototype"></iframe></div>
      <aside>
        <p class="eyebrow">Presto Brand Studio</p>
        <h1>Mobile prototype</h1>
        <p>The whole journey at a 390px phone width: event intake, brand, AI concepts, the studio editor, then publishing a demo.</p>
        <p><strong>Tap-to-fill</strong> is on, so tap any empty field and it fills with sample data. <strong>Skip</strong> jumps a step.</p>
        <div class="btns">
          <a class="btn" href="./" target="_blank" rel="noopener">Open full screen</a>
          <a class="btn btn--ghost" href="../" target="_blank" rel="noopener">Storybook</a>
        </div>
      </aside>
    </div>
    <script>
      // On a real phone, skip the frame and open the app directly.
      if (window.matchMedia('(max-width: 480px)').matches) window.location.replace('./')
    </script>
  </body>
</html>
